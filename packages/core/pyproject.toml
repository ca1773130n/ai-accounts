[project]
name = "ai-accounts-core"
version = "0.3.0a2"
description = "Framework-agnostic core for ai-accounts: protocols, services, wire protocol."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
    "msgspec>=0.18",
    "aiosqlite>=0.20",
    "cryptography>=43.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
testing = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_accounts_core"]
# Ship schema.sql inside the built wheel via a normal include pattern
# rather than `force-include`. force-include materializes a physical
# directory in site-packages during editable installs which shadows the
# editable .pth file and breaks imports (see HypePaper PR #117 for the
# failure mode). `storage.py` loads the schema relative to `__file__`
# at runtime, so in editable mode the file is already next to the
# source — no copy is needed.
include = [
    "src/ai_accounts_core/**/*.sql",
    "src/ai_accounts_core/py.typed",
]
