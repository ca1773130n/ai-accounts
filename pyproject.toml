[project]
name = "ai-accounts-workspace"
version = "0.0.0"
description = "ai-accounts monorepo workspace root (not published)"
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["packages/core", "packages/litestar", "apps/playground"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.11",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "ASYNC"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages/*/tests"]

[tool.mypy]
python_version = "3.11"
strict = true
